version: "3.8"
services:
  mi-web:
    image: nginxdemos/hello:plain-text
    container_name: app-hola-mundo
    restart: unless-stopped
    environment:
      # Formato requerido: alumno-app.servidorgp.somosdelprieto.com
      - VIRTUAL_HOST=alumno-app.servidorgp.somosdelprieto.com
      - VIRTUAL_PORT=80
    networks:
      - proxy

networks:
  proxy:
    external: true
    